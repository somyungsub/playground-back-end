plugins {
    id 'java'
}

group = 'playground-back-end'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    // 공통 라이브러리
    implementation "playground-back-end:common-dependencies:1.0.0-SNAPSHOT"
    implementation "org.springframework.boot:spring-boot-starter:3.2.10"
//    implementation "playground-back-end:common-dependencies:spring-boot-3:1.0.0-SNAPSHOT"
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}