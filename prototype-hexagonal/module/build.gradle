plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springManageVersion}"
}

subprojects { subproject ->
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    dependencies {
        // spring
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-webflux'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
        implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-test'
        implementation 'org.springframework.kafka:spring-kafka'

        // db
        implementation 'org.postgresql:postgresql:42.5.0'
        implementation 'io.r2dbc:r2dbc-postgresql'
        implementation 'io.r2dbc:r2dbc-postgresql:0.8.12.RELEASE'
        implementation 'io.r2dbc:r2dbc-pool'

        // 서드파티(querydsl,...)
        implementation 'com.querydsl:querydsl-jpa:5.0.0'
        implementation 'com.querydsl:querydsl-apt:5.0.0'
        implementation 'com.querydsl:querydsl-sql-spring:5.0.0'
        annotationProcessor 'com.querydsl:querydsl-apt:5.0.0'

        if (subproject.name != 'common') {
            implementation project(':module:common')
        }

//        implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
//        implementation 'com.querydsl:querydsl-core:5.1.0'
//        implementation 'com.querydsl:querydsl-apt:5.1.0:jakarta'
//        implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'   // QueryDSL with Jakarta support
//        annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'

    }

    // QueryDSL 설정
    def querydslDir = "${buildDir}/generated/querydsl"  // 절대 경로로 명확히 설정

    // QueryDSL 코드 생성 설정
    sourceSets {
        main.java.srcDirs += querydslDir
    }

    configurations {
        querydsl.extendsFrom compileClasspath
    }

    task generateQueryDSL(type: JavaCompile, group: 'build') {
        source = sourceSets.main.java
        classpath = configurations.compileClasspath
        options.annotationProcessorPath = configurations.querydsl
        destinationDir = file(querydslDir)
        options.compilerArgs = [
                '-proc:only',
                '-processor', 'com.querydsl.apt.jpa.JPAAnnotationProcessor'
        ]
    }

    compileJava {
        dependsOn generateQueryDSL
    }

    jar {
        enabled = true
    }

    bootJar {
        enabled = false
    }

    test {
        useJUnitPlatform()
    }
}

