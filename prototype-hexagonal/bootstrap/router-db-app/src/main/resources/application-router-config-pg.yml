spring:
  datasource:
    #    url: jdbc:postgresql://localhost:35432/wne3
    #    jdbc-url: jdbc:postgresql://localhost:35432/wne3
    url: jdbc:postgresql://localhost:15432/wne3?currentSchema=his
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hibernate.default_schema: his
        default_schema: his
        format_sql: true
wne:
  his:
    routing:
      enabled: true
      header-key: W1ne-Type
      default-key-name: DESIGNER
      datasources:
        - key-name: DESIGNER
          header-mapping-values: [ 'test1','DESIGNER' ]
          url: jdbc:postgresql://localhost:15432/wne3
          username: postgres
          password: password
          driver-class-name: org.postgresql.Driver
          schema: his
        - key-name: RUNTIME
          header-mapping-values: [ 'test2','RUNTIME' ]
          url: jdbc:postgresql://localhost:25432/wne3
          username: postgres
          password: password
          driver-class-name: org.postgresql.Driver
          schema: his