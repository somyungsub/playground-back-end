plugins {
    id "org.springframework.boot" version "${springBootVersion}"
    id "io.spring.dependency-management" version "${springManageVersion}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlinVersion}" apply false // 코틀린 하위 모듈에서 적용
    id "java"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'playground-back-end'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        gradlePluginPortal()
//        jcenter()
    }

//    var mockitoAgent = configurations.create('mockitoAgent')

    // TODO 스프링부트 3.5이상
//    configurations {
//        mockitoAgent {
//            transitive = false // 의존성 트리 최소화
//        }
//    }

    dependencies {
        // 공통 라이브러리
        implementation "playground-back-end:common-dependencies:1.0.0-SNAPSHOT"

        implementation 'org.apache.logging.log4j:log4j-api:2.17.2'
        implementation 'io.netty:netty-transport-native-epoll:4.1.79.Final'

        implementation 'org.mapstruct:mapstruct:1.5.5.Final'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

        // Lombok
        compileOnly "org.projectlombok:lombok:1.18.34"
        annotationProcessor "org.projectlombok:lombok:1.18.34"
        testCompileOnly "org.projectlombok:lombok:1.18.34"
        testAnnotationProcessor "org.projectlombok:lombok:1.18.34"

        testImplementation('org.junit-pioneer:junit-pioneer:2.3.0')
        testImplementation('org.junit.platform:junit-platform-launcher')
        testImplementation('org.mockito:mockito-core:5.18.0')
//        mockitoAgent 'org.mockito:mockito-core:5.18.0'
//        testImplementation 'org.mockito:mockito-inline:5.2.0'
//        mockitoAgent 'org.mockito:mockito-inline:5.2.0'       // javaagent로 사용할 mockito-inline 설정

        // spring
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
//        developmentOnly('org.springframework.boot:spring-boot-docker-compose')

    }

    test{
        useJUnitPlatform()
//        jvmArgs("-javaagent:${configurations.mockitoAgent.asPath}")
//        jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}" // mockito-inline
    }
}

